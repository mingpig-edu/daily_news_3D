name: Daily 3D Print Brief

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
      timezone: 'Asia/Hong_Kong'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'brief.config.json'
      - '.github/workflows/daily-brief.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: github.event_name != 'push'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate daily brief
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-report.mjs

      - name: Save generated report to repository
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- docs/reports; then
            echo "No report changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reports
          git commit -m "chore: update daily 3D print brief"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './docs'

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
